name: Run News Aggregator

on:
  # schedule:
  #   - cron: '0 */6 * * *'
  # workflow_dispatch:

permissions:
  contents: read

jobs:
  run-aggregator:
    runs-on: ubuntu-latest
    concurrency:
      group: run-aggregator
      cancel-in-progress: true
    timeout-minutes: 60
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate required secrets
        run: |
          missing=false
          for var in MISTRAL_API_KEY FIRECRAWL_API_KEY PINECONE_API_KEY SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            echo "One or more required secrets are missing. Failing workflow."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run tests / lint (optional)
        run: |
          # add tests or linters if available, e.g.:
          # pytest -q
          echo "No tests configured"

      - name: Run main script
        run: python main.py
